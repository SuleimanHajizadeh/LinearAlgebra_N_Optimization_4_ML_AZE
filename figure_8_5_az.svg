<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000"/>
    </marker>
    <marker id="dim-arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#000"/>
    </marker>
    <marker id="dim-arrow-end" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000"/>
    </marker>
  </defs>

  <style>
    .box { fill: #ffffff; stroke: #000000; stroke-width: 1.8; }
    .box-title { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: bold; text-anchor: middle; fill: #000000; }
    .dim-line { stroke: #000000; stroke-width: 1.2; }
    .dim-text { font-family: "Times New Roman", Times, serif; font-size: 14px; font-style: italic; text-anchor: middle; fill: #000000; }
    .conn-arrow { stroke: #000000; stroke-width: 2.2; fill: none; }
    .label-text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 9px; font-weight: bold; fill: #000000; text-anchor: middle; }
  </style>

  <!-- Left Box: XAM KƏMİYYƏT MATRİSİ Q=[q_ij] -->
  <g id="box-left">
    <!-- Dimensions -->
    <line x1="75" y1="130" x2="195" y2="130" class="dim-line" marker-start="url(#dim-arrow-start)" marker-end="url(#dim-arrow-end)"/>
    <text x="135" y="122" class="dim-text">d</text>
    <line x1="60" y1="145" x2="60" y2="275" class="dim-line" marker-start="url(#dim-arrow-start)" marker-end="url(#dim-arrow-end)"/>
    <text x="48" y="214" class="dim-text">n</text>

    <!-- Box -->
    <rect x="70" y="140" width="130" height="140" class="box"/>
    <text x="135" y="205" class="box-title">XAM KƏMİYYƏT</text>
    <text x="135" y="225" class="box-title">MATRİSİ Q=[q<tspan font-size="9" dy="2">ij</tspan><tspan dy="-2">]</tspan></text>
  </g>

  <!-- Top Right Box: VERİLƏN DƏYƏRİ MATRİSİ D=[x_ij] -->
  <g id="box-top-right">
    <!-- Dimensions -->
    <line x1="365" y1="20" x2="485" y2="20" class="dim-line" marker-start="url(#dim-arrow-start)" marker-end="url(#dim-arrow-end)"/>
    <text x="425" y="12" class="dim-text">d</text>
    <line x1="350" y1="35" x2="350" y2="165" class="dim-line" marker-start="url(#dim-arrow-start)" marker-end="url(#dim-arrow-end)"/>
    <text x="338" y="104" class="dim-text">n</text>

    <!-- Box -->
    <rect x="360" y="30" width="130" height="140" class="box"/>
    <text x="425" y="95" class="box-title">VERİLƏN DƏYƏRİ</text>
    <text x="425" y="115" class="box-title">MATRİSİ D=[x<tspan font-size="9" dy="2">ij</tspan><tspan dy="-2">]</tspan></text>
  </g>

  <!-- Bottom Right Box: ÇƏKİ MATRİSİ W=[w_ij] -->
  <g id="box-bottom-right">
    <!-- Dimensions -->
    <line x1="365" y1="210" x2="485" y2="210" class="dim-line" marker-start="url(#dim-arrow-start)" marker-end="url(#dim-arrow-end)"/>
    <text x="425" y="202" class="dim-text">d</text>
    <line x1="350" y1="225" x2="350" y2="355" class="dim-line" marker-start="url(#dim-arrow-start)" marker-end="url(#dim-arrow-end)"/>
    <text x="338" y="294" class="dim-text">n</text>

    <!-- Box -->
    <rect x="360" y="220" width="130" height="140" class="box"/>
    <text x="425" y="285" class="box-title">ÇƏKİ</text>
    <text x="425" y="305" class="box-title">MATRİSİ W=[w<tspan font-size="9" dy="2">ij</tspan><tspan dy="-2">]</tspan></text>
  </g>

  <!-- Connecting Arrows -->
  <!-- Upper arrow: (200, 210) to (355, 105) -->
  <g id="upper-conn">
    <line x1="200" y1="210" x2="355" y2="105" class="conn-arrow" marker-end="url(#arrow)"/>
    <text x="260" y="153" transform="rotate(-34.1 260 153)" class="label-text">SÖNDÜRMƏ VƏ YA İKİLƏŞDİRMƏ</text>
  </g>

  <!-- Lower arrow: (200, 210) to (355, 315) -->
  <g id="lower-conn">
    <line x1="200" y1="210" x2="355" y2="315" class="conn-arrow" marker-end="url(#arrow)"/>
    <text x="270" y="276" transform="rotate(34.1 270 276)" class="label-text">TƏTBİQƏ XAS FUNKSİYA</text>
  </g>
</svg>